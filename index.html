<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroVida - Produção e Tecnologia Agrícola</title>
    <style>
        /* Estilos Básicos de Cores e Fontes (Identidade Agro) */
        :root {
            --verde-principal: #2e7d32;
            --verde-escuro: #1b5e20;
            --terra: #8d6e63;
            --fundo-claro: #f5f5f5;
            --texto-escuro: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--fundo-claro);
            color: var(--texto-escuro);
            line-height: 1.6;
        }

        /* Cabeçalho e Menu */
        header {
            background-color: var(--verde-principal);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Banner Principal (Hero) */
        .hero {
            background-color: var(--verde-escuro);
            color: white;
            padding: 80px 20px;
            text-align: center;
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .btn {
            background-color: var(--terra);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #6d4c41;
        }

        /* Conteúdo Principal */
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Seção Sobre */
        .sobre {
            text-align: center;
            margin-bottom: 60px;
        }

        /* Grid de Produtos/Serviços */
        .servicos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid var(--verde-principal);
        }

        .card h3 {
            color: var(--verde-escuro);
            margin-top: 0;
        }
