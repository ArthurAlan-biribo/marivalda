    <header><h1>O que é a Cladística?</h1></header>
    <article><p>A cladística é um método de classificação biológica que agrupa organismos baseando-se exclusivamente em ancestrais comuns e caracteres derivados compartilhados (sinapomorfias), criando "clados".</p></article>
